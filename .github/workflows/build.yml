name: Build

# macOS build is intentionally deferred (see project notes) — Windows only for now.
# node-llama-cpp cannot package an x64 app on an arm64 host (only the reverse is
# supported), and GitHub-hosted `macos-latest` runners are arm64-only, so the mac
# job needs a resolved runner/arch strategy before it's added here.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 20

      - name: Build
        run: npm run build

      - name: Package (portable + nsis)
        run: npx electron-builder --win --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kidquiz-windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe
          generate_release_notes: true
