appId: com.kidquiz.app
productName: KidQuiz
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/node-llama-cpp/**/*
  - node_modules/better-sqlite3/**/*
win:
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.education
